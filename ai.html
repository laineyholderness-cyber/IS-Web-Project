<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BYU Trivia Game</title>

<style>
    body {
        font-family: Georgia, 'Times New Roman', serif;
        background-color: #f0f4ff;
        text-align: center;
        margin: 0;
    }

    .header {
        background-color: #002E5D;
        color: white;
        padding: 20px;
        font-size: 28px;
    }

    .main {
        padding: 20px;
    }

    .question-box {
        background-color: white;
        padding: 20px;
        margin: 20px auto;
        width: 60%;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
    }

    .option {
        display: block;
        margin: 10px;
        padding: 10px;
        background-color: #e6ecff;
        border-radius: 5px;
        cursor: pointer;
    }

    .option:hover {
        background-color: #cfd9ff;
    }

    .correct {
        background-color: #a8e6a3 !important;
    }

    .incorrect {
        background-color: #f5a3a3 !important;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #002E5D;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px;
    }

    button:hover {
        background-color: #001f3f;
    }

    .footer {
        background-color: #002E5D;
        color: white;
        padding: 10px;
        width: 100%;
    }
</style>

</head>
<body>

<div class="header">
    📚 BYU Trivia Challenge 🍎
</div>

<div class="main">

    <button id="startBtn" onclick="startGame()">Start Game</button>

    <div id="game" class="question-box" style="display:none;">
        <h2 id="question"></h2>
        <div id="options"></div>
    </div>

    <div id="result" class="question-box" style="display:none;"></div>

</div>

<div class="footer">
    Educational Trivia Game
</div>

<script>
    const questions = [
        {
            question: "When was Brigham Young University founded?",
            options: ["1875", "1950", "1847", "1990"],
            answer: "1875"
        },
        {
            question: "Who was BYU's first ever No. 1 ranked basketball recruit?",
            options: ["Kevin Young", "Richie Saunders", "AJ Dybantsa", "Jimmer Fredette"],
            answer: "AJ Dybantsa"
        },
        {
            question: "What treat is BYU famous for having at its sports games?",
            options: ["Koulach", "Cougartail", "Dole Whip", "Mint Oreo"],
            answer: "Cougartail"
        },
        {
            question: "What stands in the lobby of the Talmage Building on BYU campus?",
            options: ["A giant statue of Po the Panda", "a lifelike cougar", "a statue of President Oaks", "a model of the Salt Lake temple"],
            answer: "A giant statue of Po the Panda"
        },
        {
            question: "How many students are currently attending BYU?",
            options: ["50,000 students", "25,000 students", "just under 28,000 students", "over 35,000 students"],
            answer: "over 35,000 students"
        }
    ];

    let currentQuestion = 0;
    let correct = 0;
    let wrong = 0;
    let answered = false;

    function startGame() {
        document.getElementById("startBtn").style.display = "none";
        document.getElementById("result").style.display = "none";
        document.getElementById("game").style.display = "block";

        currentQuestion = 0;
        correct = 0;
        wrong = 0;

        showQuestion();
    }

    function showQuestion() {
        answered = false;

        let q = questions[currentQuestion];
        document.getElementById("question").innerText = q.question;

        let optionsHTML = "";
        q.options.forEach(option => {
            optionsHTML += `<div class="option" onclick="checkAnswer(this, '${option}')">${option}</div>`;
        });

        document.getElementById("options").innerHTML = optionsHTML;
    }

    function checkAnswer(element, selected) {
        if (answered) return;
        answered = true;

        let correctAnswer = questions[currentQuestion].answer;
        let options = document.querySelectorAll(".option");

        options.forEach(opt => {
            if (opt.innerText === correctAnswer) {
                opt.classList.add("correct");
            }
        });

        if (selected === correctAnswer) {
            correct++;
        } else {
            element.classList.add("incorrect");
            wrong++;
        }

        setTimeout(() => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                endGame();
            }
        }, 1500);
    }

    function endGame() {
        document.getElementById("game").style.display = "none";
        document.getElementById("result").style.display = "block";

        document.getElementById("result").innerHTML = `
            <h2>🎉 Congratulations!</h2>
            <p>You got ${correct} questions correct.</p>
            <p>Incorrect: ${wrong}</p>
            <button onclick="restartGame()">Restart Game</button>
        `;
    }

    function restartGame() {
        startGame();
    }
</script>

</body>
</html>
